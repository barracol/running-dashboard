name: Desktop builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: Running-Dashboard-macOS
          - os: windows-latest
            artifact: Running-Dashboard-Windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install desktop dependencies
        run: python -m pip install -r desktop/requirements.txt
      - name: Build application
        run: pyinstaller --noconfirm --clean desktop/RunningDashboard.spec
      - name: Archive macOS application
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "dist/Running Dashboard.app" "dist/Running-Dashboard-macOS.zip"
      - name: Archive Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/RunningDashboard" -DestinationPath "dist/Running-Dashboard-Windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.zip
          if-no-files-found: error
